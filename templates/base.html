<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Declaración UTF-8 y viewport responsivo -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATELIER | Boutique Collection</title>

    <!-- Framework de estilos Bootstrap 5 vía CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tipografía Inter de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Estilos de identidad visual de la boutique (Editorial / High-Fashion) -->
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #FFFFFF; 
            color: #111111; 
            letter-spacing: -0.01em; 
        }
        .navbar-brand { 
            font-weight: 600; 
            font-size: 1.1rem; 
            letter-spacing: 0.18em; 
            text-transform: uppercase; 
        }
        .nav-link { 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            letter-spacing: 0.1em; 
            color: #111111 !important; 
            padding: 0.5rem 1rem !important; 
        }
        .btn-atelier-dark { 
            background-color: #000000; 
            color: #FFFFFF; 
            border-radius: 0; 
            padding: 10px 22px; 
            font-size: 0.75rem; 
            letter-spacing: 0.12em; 
            text-transform: uppercase; 
            border: 1px solid #000000; 
            transition: all 0.2s ease-in-out; 
            text-decoration: none; 
            display: inline-block; 
        }
        .btn-atelier-dark:hover { 
            background-color: #FFFFFF; 
            color: #000000; 
        }
        .btn-atelier-outline { 
            background: transparent; 
            color: #111111; 
            border-radius: 0; 
            padding: 6px 14px; 
            font-size: 0.72rem; 
            letter-spacing: 0.08em; 
            text-transform: uppercase; 
            border: 1px solid #CCCCCC; 
            transition: all 0.2s ease-in-out; 
            text-decoration: none; 
            display: inline-block; 
        }
        .btn-atelier-outline:hover { 
            border-color: #000000; 
            background: #000000; 
            color: #FFFFFF; 
        }
        .product-card { 
            border: none; 
            background: transparent; 
        }
        .product-image-box { 
            width: 100%; 
            aspect-ratio: 3 / 4; 
            overflow: hidden; 
            background-color: #F7F7F7; 
            margin-bottom: 0.75rem; 
        }
        .product-image-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.3s ease; 
        }
        .product-card:hover .product-image-box img { 
            transform: scale(1.02); 
        }
        .product-meta { 
            font-size: 0.7rem; 
            letter-spacing: 0.08em; 
            color: #767676; 
            text-transform: uppercase; 
        }
        .product-title { 
            font-size: 0.88rem; 
            font-weight: 400; 
            margin: 3px 0; 
            color: #111111; 
        }
        .product-price { 
            font-size: 0.9rem; 
            font-weight: 600; 
            margin-bottom: 8px; 
        }
    </style>
</head>
<body>
    <!-- Barra de Navegación persistente -->
    <header class="border-bottom sticky-top bg-white">
        <div class="container d-flex justify-content-between align-items-center py-3">
            <a class="navbar-brand text-decoration-none text-dark" href="{% url 'home' %}">ATELIER BOUTIQUE</a>
            <nav class="d-none d-md-flex align-items-center gap-2">
                <a class="nav-link" href="{% url 'home' %}">Inicio</a>
                <a class="nav-link" href="{% url 'prenda_list' %}">Ver Todo</a>
                <a class="nav-link" href="{% url 'prenda_list' %}?categoria=Poleras">Poleras</a>
                <a class="nav-link" href="{% url 'prenda_list' %}?categoria=Hoodies">Hoodies</a>
            </nav>
            <div>
                <a href="{% url 'prenda_create' %}" class="btn btn-atelier-dark">+ Agregar Prenda</a>
            </div>
        </div>
    </header>

    <!-- Contenedor central -->
    <main class="container my-4">
        <!-- Renderizado de mensajes flash del sistema -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show rounded-0 mb-4" role="alert">
                    <small class="text-uppercase fw-semibold">{{ message }}</small>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>
            {% endfor %}
        {% endif %}

        <!-- Bloque único que heredan las plantillas hijas -->
        {% block content %}
        {% endblock %}
    </main>

    <!-- Pie de página -->
    <footer class="border-top py-4 text-center text-muted small mt-5">
        <p class="m-0">ATELIER BOUTIQUE © 2026 — Programación Backend con Django y MariaDB/MySQL</p>
    </footer>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
