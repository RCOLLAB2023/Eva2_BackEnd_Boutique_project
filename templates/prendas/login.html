<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Editor - Boutique de Ropa</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --color-primario: #2c2a29;
            --color-acento: #c5a059;
            --color-fondo: #fcfbf9;
            --color-tarjeta: #ffffff;
            --color-borde: #e8e3dc;
            --color-texto: #333333;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--color-fondo);
            color: var(--color-texto);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background-color: var(--color-tarjeta);
            border: 1px solid var(--color-borde);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            max-width: 440px;
            width: 100%;
            padding: 2.5rem;
        }

        .brand-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            color: var(--color-primario);
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-floating label {
            color: #777;
            font-size: 0.9rem;
        }

        .form-control:focus {
            border-color: var(--color-acento);
            box-shadow: 0 0 0 0.25rem rgba(197, 160, 89, 0.25);
        }

        .btn-boutique {
            background-color: var(--color-primario);
            color: #ffffff;
            border: none;
            padding: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .btn-boutique:hover {
            background-color: var(--color-acento);
            color: #ffffff;
        }

        .alert-error-auth {
            display: none;
            font-size: 0.85rem;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 d-flex justify-content-center">
            <div class="login-card">
                <div class="text-center mb-3">
                    <i class="bi bi-shield-lock text-secondary fs-1"></i>
                </div>
                <h1 class="brand-title">Boutique Exclusiva</h1>
                <p class="brand-subtitle">Panel de Gestión y Edición</p>

                <!-- Alerta dinámica de error -->
                <div id="login-error-alert" class="alert alert-danger alert-error-auth mb-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span id="login-error-msg"></span>
                </div>

                <form id="loginForm">
                    {% csrf_token %}
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="username" placeholder="Usuario" minlength="5" maxlength="9" required autofocus>
                        <label for="username"><i class="bi bi-person me-1"></i> Usuario Editor (5 a 9 caracteres)</label>
                    </div>

                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="password" placeholder="Contraseña" minlength="9" maxlength="9" required>
                        <label for="password"><i class="bi bi-key me-1"></i> Contraseña (exactamente 9 caracteres)</label>
                    </div>

                    <button type="submit" class="btn btn-boutique w-100 rounded-pill mb-3" id="btnLogin">
                        <span id="btnText">Iniciar Sesión</span>
                        <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    </button>

                    <div class="text-center">
                        <a href="{% url 'prenda_list' %}" class="text-decoration-none text-muted small">
                            <i class="bi bi-arrow-left me-1"></i> Volver al Catálogo Público
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorAlert = document.getElementById('login-error-alert');
        const errorMsg = document.getElementById('login-error-msg');
        const btnLogin = document.getElementById('btnLogin');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        errorAlert.style.display = 'none';
        btnLogin.disabled = true;
        btnText.textContent = 'Verificando...';
        btnSpinner.classList.remove('d-none');

        try {
            const response = await fetch('/api/login/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            const data = await response.json();

            if (response.ok && data.token) {
                // Guarda el token y nombre en sessionStorage
                sessionStorage.setItem('auth_token', data.token);
                sessionStorage.setItem('auth_user', data.username);

                // Redirige al catálogo
                window.location.href = "{% url 'prenda_list' %}";
            } else {
                errorMsg.textContent = data.error || 'Credenciales inválidas. Revise los datos ingresados.';
                errorAlert.style.display = 'block';
            }
        } catch (error) {
            errorMsg.textContent = 'Error de comunicación con el servidor. Intente nuevamente.';
            errorAlert.style.display = 'block';
        } finally {
            btnLogin.disabled = false;
            btnText.textContent = 'Iniciar Sesión';
            btnSpinner.classList.add('d-none');
        }
    });
</script>

</body>
</html>
